    <text x="830" y="990" class="text-blue" font-size="19">معمل أمن الشبكات</text>
    <text x="1110" y="930" class="text-blue" font-size="20">استراحة الطلاب</text>

    <text x="310" y="690" class="text-blue-sm">المصعد</text>
    <text x="310" y="715" class="text-blue-sm">السلالم</text>

    <text x="280" y="1000" class="text-blue-sm">دورة مياه</text>
    <text x="420" y="980" class="text-blue-sm">السلالم</text>
    <text x="420" y="1010" class="text-blue-sm">المصعد</text>

