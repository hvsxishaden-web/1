    <text x="1160" y="405" class="text-blue" font-size="14">( Lab - COE 370 )</text>

    <text x="1420" y="380" class="text-blue" font-size="16">معمل المعالج الدقيق</text>
    <text x="1420" y="405" class="text-blue" font-size="14">( Lab - COE 373 )</text>

    <text x="1240" y="520" class="text-blue-sm">المصعد</text>
    <text x="1310" y="520" class="text-blue-sm">السلالم</text>
    <text x="1400" y="550" class="text-blue-sm">دورة مياه</text>

    <text x="1470" y="460" class="text-blue" font-size="15">معمل المشاريع / المتحكم الدقيق</text>
    <text x="1470" y="485" class="text-blue" font-size="13">( Lab - COE 382 )</text>

    <text x="1470" y="570" class="text-blue" font-size="15">معمل الإلكترونيات / الدوائر الكهربائية</text>
    <text x="1470" y="595" class="text-blue" font-size="13">( Lab - COE 385 )</text>
  </g>

