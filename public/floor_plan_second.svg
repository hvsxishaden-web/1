  <text x="400" y="115" class="text-blue-sm">المصعد</text>
  <text x="400" y="145" class="text-blue-sm">السلالم</text>

  <!-- Classrooms COE 301 - COE 304 -->
  <g class="text-blue" font-size="18">
    <text x="450" y="200">COE 301</text>
    <text x="530" y="200">COE 302</text>
    <text x="610" y="200">COE 303</text>
    <text x="690" y="200">COE 304</text>
  </g>

