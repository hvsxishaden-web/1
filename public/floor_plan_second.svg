      <text x="1410" y="685">هيئة التدريس</text>
      <text x="1410" y="710">قسم هندسة الحاسب</text>

      <text x="1220" y="660">مكاتب أعضاء</text>
      <text x="1220" y="685">هيئة التدريس</text>
      <text x="1220" y="710">قسم هندسة الحاسب</text>

      <text x="1030" y="660">مكاتب أعضاء</text>
      <text x="1030" y="685">هيئة التدريس</text>
      <text x="1030" y="710">قسم هندسة الحاسب</text>

      <text x="850" y="660">مكاتب أعضاء</text>
      <text x="850" y="685">هيئة التدريس</text>
      <text x="850" y="710">قسم هندسة الحاسب</text>
    </g>
  </g>

  <!-- Bottom Section -->
  <g text-anchor="middle">
    <text x="500" y="920" class="text-blue" font-size="22">عميد الكلية</text>

    <text x="690" y="920" class="text-blue" font-size="18">وكيل الشؤون الطلابية</text>
    <text x="690" y="970" class="text-blue" font-size="18">وكيل الشؤون التعليمية</text>

    <text x="1000" y="920" class="text-blue" font-size="20">الشؤون الإدارية</text>
    <text x="1000" y="970" class="text-blue" font-size="18">الشؤون الإدارية</text>

    <text x="800" y="1020" class="text-blue" font-size="18">معمل الابتكار للبرمجيات مفتوحة المصدر</text>

    <text x="310" y="690" class="text-blue-sm">المصعد</text>
    <text x="310" y="715" class="text-blue-sm">السلالم</text>

    <text x="280" y="1000" class="text-blue-sm">دورة مياه</text>
    <text x="410" y="1000" class="text-blue-sm">السلالم</text>
    <text x="410" y="1025" class="text-blue-sm">المصعد</text>

    <text x="870" y="920" class="text-blue-sm">المصعد</text>
    <text x="920" y="920" class="text-blue-sm">السلالم</text>

    <text x="1240" y="920" class="text-blue-sm">المصعد</text>
    <text x="1310" y="920" class="text-blue-sm">السلالم</text>
  </g>

  <!-- Watermark -->
  <text x="1520" y="1040" class="text-red">Made by Vilwsn</text>
</svg>