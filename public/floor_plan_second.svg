    <text x="780" y="170" class="text-blue" font-size="13">( Lab - COE 328 )</text>

    <text x="980" y="150" class="text-blue" font-size="15">معمل الروبوتات</text>
    <text x="980" y="170" class="text-blue" font-size="13">( Lab - COE 330 )</text>

    <text x="1050" y="250" class="text-blue" font-size="16">معمل التصميم المنطقي</text>
    <text x="1050" y="275" class="text-blue" font-size="14">( Lab - COE 337 )</text>
  </g>

