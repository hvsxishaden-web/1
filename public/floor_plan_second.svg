<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background-color: #ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <style>
    .blue-line { stroke: #2563eb; stroke-width: 4; stroke-linecap: round; }
    .thin-blue-line { stroke: #2563eb; stroke-width: 3; stroke-linecap: round; }
    .text-blue { fill: #1d4ed8; font-weight: bold; font-size: 16px; text-anchor: middle; }
    .text-blue-sm { fill: #2563eb; font-weight: 600; font-size: 13px; text-anchor: middle; }
    .text-title { fill: #000000; font-weight: 800; font-size: 32px; text-anchor: middle; }
    .text-black { fill: #000000; font-weight: bold; font-size: 16px; text-anchor: middle; }
    .text-red { fill: #dc2626; font-weight: 800; font-size: 26px; text-anchor: end; }
  </style>

  <!-- Title Box Top Right -->
  <g transform="translate(1080, 40)">
    <rect x="0" y="0" width="460" height="75" fill="#ffffff" stroke="#000000" stroke-width="3" rx="4"/>
    <text x="230" y="48" font-size="28" font-weight="bold" fill="#000000" text-anchor="middle">مخطط كلية الحاسب - طلاب</text>
  </g>
  
  <!-- Floor Title -->
  <text x="750" y="80" class="text-title">الدور الثاني</text>

  <!-- Main Blueprint Axis Lines -->
  <line x1="120" y1="220" x2="1500" y2="220" class="blue-line"/>
  <line x1="120" y1="560" x2="1500" y2="560" class="blue-line"/>
  <line x1="120" y1="880" x2="1500" y2="880" class="blue-line"/>

  <!-- Vertical Lines -->
  <line x1="370" y1="120" x2="370" y2="1020" class="blue-line"/>
  <line x1="890" y1="120" x2="890" y2="1020" class="blue-line"/>
  <line x1="1280" y1="220" x2="1280" y2="880" class="blue-line"/>

  <!-- Secondary Divider Lines -->
  <line x1="890" y1="310" x2="1180" y2="310" class="thin-blue-line"/>
  <line x1="1180" y1="220" x2="1180" y2="310" class="thin-blue-line"/>

  <!-- Central Circle Rotunda -->
  <circle cx="370" cy="560" r="75" fill="#ffffff" stroke="#2563eb" stroke-width="5"/>

  <!-- Left Wing Labels (عمادة تقنية المعلومات) -->
  <g font-size="15" font-weight="bold" fill="#000000">
    <text x="65" y="210">عمادة</text>
    <text x="40" y="235">تقنية المعلومات</text>

    <text x="65" y="550">عمادة</text>
    <text x="40" y="575">تقنية المعلومات</text>

    <text x="65" y="870">عمادة</text>
    <text x="40" y="895">تقنية المعلومات</text>
  </g>

  <!-- Top Utilities -->
